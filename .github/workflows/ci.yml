# Runs on every push and pull request: checks the seed data before it can reach Databricks.
# Deployment from GitHub gets added once the pipeline exists (week 3-4).
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
